[workspace]
resolver = "3"
members = [
    "instruments/wavegraph-*",
    "wavegraph-adsr",
    "wavegraph-arp",
    "wavegraph-lfo",
    "wavegraph-audio",
    "wavegraph-core",
    "wavegraph-dsp",
    "wavegraph-fx",
    "wavegraph-fm1",
    "wavegraph-fm1-core",
    "wavegraph-sample"
]

[workspace.package]
rust-version = "1.88"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
fm1-assets = { version = "0.2.0", default-features = false }
fm1-graphics = { version = "0.2.0", features = ["embedded-graphics"] }
fm1-rticx = "0.2.1"
fm1-audio = { version = "0.2.1", default-features = false }
heapless = { version = "0.9.4", default-features = false }
wavegraph-adsr = { version = "0.0.0", path = "wavegraph-adsr" }
wavegraph-arp = { version = "0.0.0", path = "wavegraph-arp" }
wavegraph-lfo = { version = "0.0.0", path = "wavegraph-lfo" }
wavegraph-core = { version = "0.0.0", path = "wavegraph-core" }
wavegraph-fx = { version = "0.0.0", path = "wavegraph-fx" }
wavegraph-sample = { version = "0.2.0-pre", path = "wavegraph-sample", default-features = false }

[workspace.lints.clippy]
arithmetic_side_effects = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
manual_assert = "warn"
map_unwrap_or = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
mod_module_files = "warn"
must_use_candidate = "warn"
panic = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"

[workspace.lints.rust]
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[profile.firmware]
inherits = "release"
opt-level = 3
codegen-units = 1
lto = true
panic = "abort"
