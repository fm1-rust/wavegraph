[workspace]
resolver = "3"
members = [
    "instruments/wavegraph-*",
    "wavegraph",
    "wavegraph-core",
    "wavegraph-fx",
    "wavegraph-fm1",
    "wavegraph-sample"
]

[workspace.package]
rust-version = "1.88"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
heapless = { version = "0.9.4", default-features = false }
wavegraph-core = { version = "0.1", path = "wavegraph-core" }
wavegraph-fx = { version = "0.1", path = "wavegraph-fx" }
wavegraph-sample = { version = "0.1", path = "wavegraph-sample", default-features = false }

[patch.crates-io]
# Share the workspace PCM type with the FM-1 audio mixer.
wavegraph-sample = { path = "wavegraph-sample" }

[workspace.lints.clippy]
arithmetic_side_effects = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
manual_assert = "warn"
map_unwrap_or = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
mod_module_files = "warn"
must_use_candidate = "warn"
panic = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"

[workspace.lints.rust]
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[profile.firmware]
inherits = "release"
opt-level = "s"
codegen-units = 1
lto = true
panic = "abort"
