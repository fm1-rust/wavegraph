[package]
name = "wavegraph-fx"
description = "Allocation-free shared send effects for WaveGraph"
version = "0.0.0"
license.workspace = true
repository = "https://github.com/fm1-rust/wavegraph"
categories = ["embedded", "multimedia::audio", "no-std"]
keywords = ["audio", "dsp", "reverb", "no-alloc"]
edition = "2024"
rust-version.workspace = true

[features]
short-detector-probe = []

[dependencies]
libm = "0.2"
wavegraph-core.workspace = true
wavegraph-lfo.workspace = true
wavegraph-sample.workspace = true

[lints]
workspace = true
