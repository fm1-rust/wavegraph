[package]
name = "wavegraph-fm1"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false
description = "Three WaveGraph instruments (monosynth, house organ, 303) and oscilloscope for FM-1"

[dependencies]
heapless.workspace = true
micromath = "2.2"
wavegraph = { path = "../wavegraph", features = ["async"] }
wavegraph-303 = { path = "../wavegraph-303" }
wavegraph-fx.workspace = true
wavegraph-monosynth = { path = "../wavegraph-monosynth" }
wavegraph-organ = { path = "../wavegraph-organ" }
wavegraph-sample.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
embedded-graphics = "0.8.2"
fm1-audio = "0.1"
fm1-controls = "0.1.1"
fm1-graphics = { version = "0.1", features = ["async-display"] }
fm1-rticx = { version = "0.1.1", features = ["audio", "async-display"] }
static_cell = "2.1.1"

[lints]
workspace = true
