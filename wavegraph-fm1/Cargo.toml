[package]
name = "wavegraph-fm1"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false
build = "assets/bumper.rs"
description = "Four assignable WaveGraph channels with synths, 808 and 909 kits, and an oscilloscope for FM-1"

[dependencies]
heapless.workspace = true
micromath = "2.2"
wavegraph = { path = "../wavegraph", features = ["async"] }
wavegraph-303 = { path = "../instruments/wavegraph-303" }
wavegraph-808 = { path = "../instruments/wavegraph-808" }
wavegraph-909 = { path = "../instruments/wavegraph-909" }
wavegraph-adsr.workspace = true
wavegraph-arp.workspace = true
wavegraph-fx.workspace = true
wavegraph-monosynth = { path = "../instruments/wavegraph-monosynth" }
wavegraph-organ = { path = "../instruments/wavegraph-organ" }
wavegraph-sample.workspace = true
wavegraph-supersaw = { path = "../instruments/wavegraph-supersaw" }
wavegraph-wavetable = { path = "../instruments/wavegraph-wavetable" }

[target.'cfg(target_os = "none")'.dependencies]
wavegraph-303 = { path = "../instruments/wavegraph-303", features = ["fm1-ram-code"] }
embedded-graphics = "0.8.2"
futures-util = { version = "0.3", default-features = false }
fm1-audio = "0.2.0-rc.0"
fm1-controls = "0.2.0-rc.0"
fm1-graphics = { version = "0.2.0-rc.0", features = ["async-display"] }
fm1-rticx = { version = "0.2.0-rc.0", features = ["audio", "async-display", "async-usb", "usb-log"] }
static_cell = "2.1.1"

[build-dependencies]
midly = { version = "0.5.3", default-features = false, features = ["std", "strict"] }
wavegraph-303 = { path = "../instruments/wavegraph-303" }
wavegraph-909 = { path = "../instruments/wavegraph-909" }

[lints]
workspace = true
