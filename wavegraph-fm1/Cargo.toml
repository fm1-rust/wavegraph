[package]
name = "wavegraph-fm1"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false
build = "assets/bumper.rs"
description = "Four assignable WaveGraph channels with synths, 808 and 909 kits, and an oscilloscope for FM-1"

[features]
default = ["lofi-samples", "packed-cymbals", "packed-samples"]
# Use the compact Amen and lower-rate IMA versions of the two stabs and zap.
lofi-samples = []
late-block-probe = []
# Opt in on hardware. The browser emulator currently lacks the paired 32-bit add.
pi32v2-simd = ["wavegraph-supersaw/pi32v2-simd"]
# Store the factory 909 cymbals as losslessly packed PCM16.
packed-cymbals = []
# Use the same PCM1 format for the chromatic sampler bank.
packed-samples = []
# A/B the master compressor detector on the same board and factory patch.
short-detector-probe = ["wavegraph-fx/short-detector-probe"]
# Requires the board and host qualifications documented in the firmware README.
qualified-usb = []

[dependencies]
fm1-assets.workspace = true
fm1-audio.workspace = true
heapless.workspace = true
micromath = "2.2"
wavegraph-dsp = { path = "../wavegraph-dsp", features = ["async"] }
wavegraph-303 = { path = "../instruments/wavegraph-303" }
wavegraph-808 = { path = "../instruments/wavegraph-808" }
wavegraph-909 = { path = "../instruments/wavegraph-909" }
wavegraph-adsr.workspace = true
wavegraph-arp.workspace = true
wavegraph-lfo.workspace = true
wavegraph-fm = { path = "../instruments/wavegraph-fm" }
wavegraph-fx.workspace = true
wavegraph-monosynth = { path = "../instruments/wavegraph-monosynth" }
wavegraph-organ = { path = "../instruments/wavegraph-organ" }
wavegraph-sample.workspace = true
wavegraph-sampler = { path = "../instruments/wavegraph-sampler", features = ["ima-adpcm", "packed-pcm", "recording"] }
wavegraph-supersaw = { path = "../instruments/wavegraph-supersaw" }
wavegraph-wavetable = { path = "../instruments/wavegraph-wavetable" }

[target.'cfg(target_os = "none")'.dependencies]
wavegraph-fm1-core = { path = "../wavegraph-fm1-core" }
wavegraph-303 = { path = "../instruments/wavegraph-303", features = ["fm1-ram-code"] }
futures-util = { version = "0.3", default-features = false }
fm1-controls = "0.2.0-rc.0"
fm1-graphics = { workspace = true, features = ["async-display"] }
fm1-rticx = { workspace = true, features = ["async-display", "async-usb", "usb-log"] }
static_cell = "2.1.1"

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }

[build-dependencies]
fm1-assets = { workspace = true, features = ["encode"] }
fm1-graphics.workspace = true
midly = { version = "0.5.3", default-features = false, features = ["std", "strict"] }
wavegraph-303 = { path = "../instruments/wavegraph-303" }
wavegraph-909 = { path = "../instruments/wavegraph-909" }

[lints]
workspace = true
