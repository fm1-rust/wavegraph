[package]
name = "wavegraph-303"
description = "WaveGraph instrument inspired by the iconic Roland TB-303"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
libm = { version = "0.2.16", default-features = false, optional = true }
micromath = { version = "2.1", default-features = false }
wavegraph-core.workspace = true
wavegraph-sample.workspace = true

[dev-dependencies]
wavegraph = { version = "0.1", path = "../wavegraph" }

[features]
raw = ["dep:libm"]

[lints]
workspace = true
