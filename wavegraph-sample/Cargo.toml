[package]
name = "wavegraph-sample" # Forked from RustAudio's `dasp_sample`
version = "0.1.0"
authors = [
    "WaveGraph Developers",
    "mitchmindtree <mitchell.nordine@gmail.com>"
]
description = """
PCM audio sample types, traits and conversions, forked from `dasp_sample` with
added `no_std` and `no_alloc` support.
"""
license = "MIT OR Apache-2.0"
repository = "https://github.com/fm1-rust/wavegraph"
readme = "README.md"
categories = ["embedded", "multimedia::audio", "no-std"]
keywords = ["audio", "dsp", "no-alloc", "pcm", "sample"]
edition = "2024"
rust-version = "1.85"

[features]
std = []

# Keep upstream's PCM conversion expressions and bounds checks verbatim.
[lints.clippy]
manual_range_contains = "allow"
precedence = "allow"
