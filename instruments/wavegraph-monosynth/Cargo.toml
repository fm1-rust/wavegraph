[package]
name = "wavegraph-monosynth"
description = "Four-waveform monophonic synthesizer for WaveGraph"
version = "0.1.0"
license.workspace = true
repository = "https://github.com/fm1-rust/wavegraph"
categories = ["embedded", "multimedia::audio", "no-std"]
keywords = ["audio", "dsp", "no-alloc", "puredata"]
edition = "2024"
rust-version.workspace = true

[dependencies]
micromath = { version = "2.2", default-features = false }
wavegraph-core.workspace = true
wavegraph-sample.workspace = true

[lints]
workspace = true
