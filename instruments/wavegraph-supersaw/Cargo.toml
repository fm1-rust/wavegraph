[package]
name = "wavegraph-supersaw"
description = "JP-8000-inspired seven-saw instrument for WaveGraph"
version = "0.0.0"
license.workspace = true
repository = "https://github.com/fm1-rust/wavegraph"
categories = ["embedded", "multimedia::audio", "no-std"]
keywords = ["audio", "dsp", "no-alloc", "puredata"]
edition = "2024"
rust-version.workspace = true

[features]
pi32v2-simd = []

[dependencies]
micromath = { version = "2.2", default-features = false }
wavegraph-adsr.workspace = true
wavegraph-core.workspace = true
wavegraph-sample.workspace = true

[lints]
workspace = true
