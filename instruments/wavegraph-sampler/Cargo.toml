[package]
name = "wavegraph-sampler"
description = "One-shot PCM sample player for WaveGraph"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/fm1-rust/wavegraph"
categories = ["embedded", "multimedia::audio", "no-std"]
keywords = ["audio", "sampler", "pcm", "no-std"]

[features]
recording = []
ima-adpcm = []
packed-pcm = ["dep:fm1-assets"]

[dependencies]
micromath = "2.2"
wavegraph-adsr.workspace = true
fm1-assets = { workspace = true, optional = true }
wavegraph-core.workspace = true
wavegraph-sample.workspace = true

[dev-dependencies]
wavegraph-dsp = { version = "0.1", path = "../../wavegraph-dsp" }

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
fm1-assets = { workspace = true, features = ["encode"] }

[lints]
workspace = true
