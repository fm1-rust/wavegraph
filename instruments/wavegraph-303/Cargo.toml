[package]
name = "wavegraph-303"
description = "WaveGraph instrument inspired by the iconic Roland TB-303"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"

[dependencies]
libm = { version = "0.2.16", default-features = false, optional = true }
micromath = { version = "2.2", default-features = false }
wavegraph-core.workspace = true
wavegraph-sample.workspace = true

[dev-dependencies]
wavegraph-dsp = { version = "0.0.0", path = "../../wavegraph-dsp" }

[features]
# The FM-1 startup copies .data to executable SRAM before the first audio interrupt.
fm1-ram-code = []
raw = ["dep:libm"]

[lints]
workspace = true
