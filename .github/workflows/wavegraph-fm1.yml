name: wavegraph-fm1

on:
  pull_request:
    paths: &firmware-paths
      - 'wavegraph-fm1/**'
      - 'wavegraph-fm1-core/**'
      - 'wavegraph-audio/**'
      - 'wavegraph-dsp/**'
      - 'instruments/wavegraph-*/**'
      - 'wavegraph-adsr/**'
      - 'wavegraph-arp/**'
      - 'wavegraph-lfo/**'
      - 'wavegraph-core/**'
      - 'wavegraph-fx/**'
      - 'wavegraph-sample/**'
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/wavegraph-fm1.yml
  push:
    branches: [main]
    paths: *firmware-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p wavegraph-fm1 -p wavegraph-fm1-core --locked
      - run: cargo test -p wavegraph-fm1 --no-default-features --locked

  firmware:
    strategy:
      matrix: &firmware-builds
        include:
          - artifact: wavegraph-fm1
            args: ''
          - artifact: wavegraph-fm1-native-mixer
            args: --features=fm1-audio/dsp
    uses: fm1-rust/fm1-rust/.github/workflows/pi32v2-build.yml@4c6a3fe082ec013ff594a06b8cd377a65bd96ffb # fm1-rticx/v0.2.0
    with:
      script: wavegraph-fm1/build.sh
      args: ${{ matrix.args }}
      artifact-name: ${{ matrix.artifact }}
      artifact-path: target/pi32v2-none/firmware/wavegraph-fm1.*

  tone:
    uses: fm1-rust/fm1-rust/.github/workflows/pi32v2-build.yml@4c6a3fe082ec013ff594a06b8cd377a65bd96ffb
    with:
      script: wavegraph-fm1-core/build.sh
      args: |
        -p
        wavegraph-fm1-core
        --example
        tone

  flash-layout:
    needs: firmware
    strategy:
      matrix: *firmware-builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: jvitkauskas/m-flasher
          ref: 8fbece7348d758ac284325eed455781675ac95ff # 0.12.1
          path: .ci/m-flasher
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - run: node wavegraph-fm1/tests/flash-layout.mjs .ci/m-flasher dist/wavegraph-fm1
