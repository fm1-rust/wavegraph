name: wavegraph-fm1

on:
  pull_request:
    paths: &firmware-paths
      - 'wavegraph-fm1/**'
      - 'wavegraph/**'
      - 'instruments/wavegraph-*/**'
      - 'wavegraph-core/**'
      - 'wavegraph-fx/**'
      - 'wavegraph-sample/**'
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/wavegraph-fm1.yml
  push:
    branches: [main]
    paths: *firmware-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p wavegraph-fm1 --locked

  firmware:
    uses: fm1-rust/fm1-rust/.github/workflows/pi32v2-build.yml@953165a87c12fac5bc1e2897d13e38a3045bbf69 # fm1-rticx/v0.1.1
    with:
      script: wavegraph-fm1/build.sh
      artifact-name: wavegraph-fm1
      artifact-path: target/pi32v2-none/firmware/wavegraph-fm1.fwsc
