name: wavegraph-fm1

on:
  pull_request:
    paths: &firmware-paths
      - 'wavegraph-fm1/**'
      - 'wavegraph-audio/**'
      - 'wavegraph/**'
      - 'instruments/wavegraph-*/**'
      - 'wavegraph-adsr/**'
      - 'wavegraph-arp/**'
      - 'wavegraph-core/**'
      - 'wavegraph-fx/**'
      - 'wavegraph-sample/**'
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/wavegraph-fm1.yml
  push:
    branches: [main]
    paths: *firmware-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p wavegraph-fm1 --locked

  firmware:
    uses: fm1-rust/fm1-rust/.github/workflows/pi32v2-build.yml@f360cf357a71b9a3f59ed0f68c8e33a3ac3aa0d7 # fm1-rticx/v0.2.0-rc.1
    with:
      script: wavegraph-fm1/build.sh
      artifact-name: wavegraph-fm1
      artifact-path: target/pi32v2-none/firmware/wavegraph-fm1.*

  flash-layout:
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: jvitkauskas/m-flasher
          ref: 8fbece7348d758ac284325eed455781675ac95ff # 0.12.1
          path: .ci/m-flasher
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wavegraph-fm1
          path: dist
      - run: node wavegraph-fm1/tests/flash-layout.mjs .ci/m-flasher dist/wavegraph-fm1
