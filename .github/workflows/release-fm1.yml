name: Release wavegraph-fm1

on:
  push:
    tags:
      - 'wavegraph-fm1/v*'

permissions:
  contents: read

jobs:
  verify:
    if: github.event.created
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # same runtime as v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag against the firmware version
        id: version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "wavegraph-fm1") | .version')
          if [[ "$GITHUB_REF_NAME" != "wavegraph-fm1/v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match wavegraph-fm1 v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: cargo test --locked -p wavegraph-fm1

  firmware:
    needs: verify
    uses: fm1-rust/fm1-rust/.github/workflows/pi32v2-build.yml@953165a87c12fac5bc1e2897d13e38a3045bbf69 # fm1-rticx/v0.1.1
    with:
      script: wavegraph-fm1/build.sh
      artifact-name: wavegraph-fm1
      artifact-path: target/pi32v2-none/firmware/wavegraph-fm1.*

  release:
    needs: [verify, firmware]
    runs-on: ubuntu-24.04
    environment: publish
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wavegraph-fm1
          path: dist
      - name: Prepare versioned release assets
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/wavegraph-fm1.fwsc
          test -s dist/wavegraph-fm1.bin
          mv dist/wavegraph-fm1.fwsc "dist/wavegraph-fm1-$VERSION.fwsc"
          mv dist/wavegraph-fm1.bin "dist/wavegraph-fm1-$VERSION.bin"
          cat > release-notes.md <<'EOF'
          Flash the `.fwsc` package with M-Flasher, or open it in the [FM-1 browser emulator](https://joakimeriksson.github.io/fm1-emu/). The `.bin` is the raw application image for emulators that accept it, such as [fm1-emulator](https://github.com/simonjohansson/fm1-emulator).
          EOF
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/wavegraph-fm1-$VERSION.fwsc" \
            "dist/wavegraph-fm1-$VERSION.bin" \
            --verify-tag --title "wavegraph-fm1 v$VERSION" \
            --notes-file release-notes.md
