name: wavegraph-dsp

on:
  pull_request:
    paths: &wavegraph-dsp-paths
      - 'wavegraph-dsp/**'
      - 'wavegraph-adsr/**'
      - 'wavegraph-core/**'
      - 'instruments/wavegraph-monosynth/**'
      - 'wavegraph-sample/**'
      - Cargo.toml
      - Cargo.lock
      - '.cargo/**'
      - .github/workflows/wavegraph-dsp.yml
  push:
    branches: [main]
    paths: *wavegraph-dsp-paths
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo +stable test -p wavegraph-dsp -p wavegraph-adsr -p wavegraph-core -p wavegraph-monosynth --all-features --locked

  thumb:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [thumbv6m-none-eabi, thumbv7em-none-eabihf]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build -p wavegraph-dsp --lib --release --no-default-features --locked --target ${{ matrix.target }}
      - run: cargo build -p wavegraph-dsp --lib --release --all-features --locked --target ${{ matrix.target }}
