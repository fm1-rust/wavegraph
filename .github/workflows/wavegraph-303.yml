name: wavegraph-303

on:
  pull_request:
    paths: &wavegraph-303-paths
      - 'wavegraph-303/**'
      - 'wavegraph-core/**'
      - 'wavegraph-sample/**'
      - 'wavegraph/**'
      - Cargo.toml
      - Cargo.lock
      - '.cargo/**'
      - .github/workflows/wavegraph-303.yml
  push:
    branches: [main]
    paths: *wavegraph-303-paths
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target thumbv7em-none-eabihf --no-self-update
      - name: Test the native DSP
        run: cargo +stable test -p wavegraph-303 --locked
      - name: Compare with the mechanical translation
        run: cargo +stable test -p wavegraph-303 --features raw --locked
      - name: Build the no_std library
        run: cargo +stable build -p wavegraph-303 --lib --release --no-default-features --target thumbv7em-none-eabihf --locked
