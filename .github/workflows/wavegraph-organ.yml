name: wavegraph-organ

on:
  pull_request:
    paths: &wavegraph-organ-paths
      - 'instruments/wavegraph-organ/**'
      - 'wavegraph-core/**'
      - 'wavegraph-sample/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/wavegraph-organ.yml'
  push:
    branches: [main]
    paths: *wavegraph-organ-paths
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target thumbv7em-none-eabihf --no-self-update
      - name: Host tests
        run: cargo +stable test -p wavegraph-organ --locked
      - name: no_std build
        run: cargo +stable build -p wavegraph-organ --lib --release --no-default-features --target thumbv7em-none-eabihf --locked
